<aside class="toolbar">
  <div class="brand-mark" title="MiragePaint">M</div>

  <div class="group">
    @for (t of tools; track t.id) {
      @if (t.group === 'select') {
        <button
          type="button"
          class="tool"
          [class.active]="drawing.tool() === t.id"
          [title]="t.label"
          (click)="select(t.id)"
        >
          <span class="material-symbols-outlined">{{ t.icon }}</span>
        </button>
      }
    }
  </div>

  <div class="divider"></div>

  <div class="group">
    @for (t of tools; track t.id) {
      @if (t.group === 'basic') {
        <button
          type="button"
          class="tool"
          [class.active]="drawing.tool() === t.id"
          [title]="t.label"
          (click)="select(t.id)"
        >
          <span class="material-symbols-outlined">{{ t.icon }}</span>
        </button>
      }
    }
  </div>

  <div class="divider"></div>

  <div class="group scroll">
    @for (t of tools; track t.id) {
      @if (t.group === 'effect') {
        <button
          type="button"
          class="tool"
          [class.active]="drawing.tool() === t.id"
          [title]="t.label"
          (click)="select(t.id)"
        >
          @if (t.customIcon === 'rainbow') {
            <svg class="rainbow-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M2.5 17a9.5 9.5 0 0 1 19 0"
                fill="none"
                stroke="#E40303"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M4.5 17a7.5 7.5 0 0 1 15 0"
                fill="none"
                stroke="#FF8C00"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M6.5 17a5.5 5.5 0 0 1 11 0"
                fill="none"
                stroke="#FFED00"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M8.5 17a3.5 3.5 0 0 1 7 0"
                fill="none"
                stroke="#008026"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M10.5 17a1.5 1.5 0 0 1 3 0"
                fill="none"
                stroke="#24408E"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="12" cy="17" r="1.1" fill="#732982" />
            </svg>
          } @else {
            <span class="material-symbols-outlined">{{ t.icon }}</span>
          }
        </button>
      }
    }
  </div>
</aside>
